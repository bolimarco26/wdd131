<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="author" content="Marco Pérez">
    <meta name="description" content="Country page about Bolivia for WDD 131 Place Assignment.">

    <title>Bolivia | WDD 131</title>

    <link rel="stylesheet" href="styles/place.css">
    <link rel="stylesheet" href="styles/temples-large.css">
</head>

<body>

    <header>
        <h1>Bolivia</h1>
    </header>

    <main>

        <section class="hero">

            <picture>

                <!-- Mobile Image -->
                <source srcset="images/hero-small.webp" media="(max-width: 768px)">

                <!-- Desktop Image -->
                <img src="images/hero-large.webp" alt="Beautiful landscape of Bolivia" width="1200" height="700">

            </picture>

        </section>

        <section class="data">

            <h2>Data</h2>

            <p><strong>Capital:</strong> Sucre</p>

            <p><strong>Largest City:</strong> Santa Cruz de la Sierra</p>

            <p><strong>Population:</strong> 12,000,000</p>

            <p><strong>Area:</strong> 1,098,581 km²</p>

            <p><strong>Languages:</strong> Spanish, Quechua, Aymara</p>

            <p><strong>Currency:</strong> Boliviano (BOB)</p>

            <p><strong>Time Zone:</strong> UTC -4</p>

        </section>

        <section class="weather">

            <h2>Weather</h2>

            <!-- Mobile Weather Icon -->
            <img src="images/weather.svg" alt="Weather Icon" class="weather-icon">

            <p><strong>Temperature:</strong> <span id="temperature">8°C</span></p>

            <p><strong>Conditions:</strong> Cloudy</p>

            <p><strong>Wind:</strong> <span id="windSpeed">12 km/h</span></p>

            <p><strong>Wind Chill:</strong> <span id="windChill"></span></p>

        </section>

    </main>

    <footer>

        <p>
            &copy;
            <span id="currentyear"></span>
            Marco Pérez | Bolivia
        </p>

        <p id="lastModified"></p>

    </footer>

    <!-- JavaScript -->
    <script src="scripts/place.js" defer></script>

</body>

</html>
